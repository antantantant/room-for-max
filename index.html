<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment Room for Max</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141f; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #label { position: fixed; left: 16px; top: 12px; color: #f3e6cf; }
  #label h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #label p { margin: 2px 0 8px; font-size: 13px; opacity: .7; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; margin-right: 4px; color: #f3e6cf; border: 1px solid rgba(243,230,207,.35); border-radius: 6px; background: rgba(30,26,24,.6); cursor: pointer; }
  button:hover { background: rgba(80,62,48,.7); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
} }
</script>
</head>
<body>
<div id="label">
  <h1>Apartment Room for Max</h1>
  <p>First light · drag to rotate · scroll to zoom · the two-window wall faces east</p>
  <button data-view="overview">Overview</button><button data-view="sketch">Sketch view</button><button data-view="plan">Floor plan</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createPipeline } from './src/pipeline.js';
import { buildScene, views } from './src/scene.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 100);
const pipeline = createPipeline(scene, camera);
const room = buildScene(scene, pipeline.renderer);
pipeline.hideFromAO.push(...room.hideFromAO);
pipeline.setVolumetric(room.volumetric);

const controls = new OrbitControls(camera, pipeline.renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.minDistance = 0.5;
controls.maxDistance = 14;
controls.addEventListener('change', () => pipeline.invalidate());

function setView(name, custom) {
  const [p, t] = custom || views[name];
  camera.position.set(...p);
  controls.target.set(...t);
  controls.update();
  pipeline.invalidate();
}
document.querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.view));
setView('overview');
window.__look = (position, target) => setView(null, [position, target]);   // console helper: aim the camera anywhere

pipeline.start(() => controls.update());
</script>
</body>
</html>
